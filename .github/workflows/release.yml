name: Publish tagged Windows release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate four-part version and main ancestry
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/validate-release-tag.ps1 -Tag $env:RELEASE_TAG
          "version=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  release:
    needs: [validate, build]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SuperCalc-*-win-x64-*
          path: packages
      - name: Prepare independent release ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectories = @(Get-ChildItem packages -Directory)
          if ($packageDirectories.Count -ne 2) { throw 'Expected two independent build artifacts.' }
          $checksums = @()
          foreach ($directory in $packageDirectories) {
            if (!(Test-Path (Join-Path $directory.FullName 'SuperCalc.App.exe'))) { throw 'Artifact must contain application files directly.' }
            $archiveName = "$($directory.Name).zip"
            $archivePath = Join-Path packages $archiveName
            Compress-Archive -Path "$($directory.FullName)/*" -DestinationPath $archivePath -CompressionLevel Optimal
            $digest = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$digest  $archiveName"
          }
          $checksums | Set-Content packages/SHA256SUMS.txt -Encoding utf8
          $notes = Get-Content (Join-Path $packageDirectories[0].FullName 'README.md') -Raw
          $build = Get-Content (Join-Path $packageDirectories[0].FullName 'BUILD.txt') -Raw
          "$notes`n`n$build" | Set-Content packages/RELEASE-NOTES.md -Encoding utf8
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem packages/*.zip)
          if ($archives.Count -ne 2) { throw 'Expected exactly two application packages.' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "SuperCalc $env:RELEASE_TAG" --notes-file packages/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $assets = @($archives.FullName) + @('packages/SHA256SUMS.txt')
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --notes-file packages/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
