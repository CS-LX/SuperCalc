name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Archive complete application
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/SuperCalc-win-x64/SuperCalc.App.pri)) { throw 'Missing XAML resource index' }
          Copy-Item LICENSE artifacts/SuperCalc-win-x64/LICENSE.txt
          Copy-Item docs/release-v1.0.0.md artifacts/SuperCalc-win-x64/README.md
          Compress-Archive -Path artifacts/SuperCalc-win-x64/* -DestinationPath artifacts/SuperCalc-win-x64.zip -CompressionLevel Optimal
          $digest = (Get-FileHash artifacts/SuperCalc-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  SuperCalc-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+([.-][a-zA-Z0-9.-]+)?$') { throw 'Expected a semantic version tag' }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "SuperCalc $env:RELEASE_TAG · 为了计算，先体验" --notes-file docs/release-v1.0.0.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG artifacts/SuperCalc-win-x64.zip artifacts/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
