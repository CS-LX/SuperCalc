name: Build native Windows app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    name: Package (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [self-contained, lightweight]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test release tag guards
        shell: pwsh
        run: ./tests/ReleaseTag.Tests.ps1
      - name: Test and prepare deployment package
        id: package
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
          PACKAGE_VARIANT: ${{ matrix.variant }}
        run: ./scripts/build.ps1 -Package -Version $env:BUILD_VERSION -Variant $env:PACKAGE_VARIANT -ArtifactUpload
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: ${{ steps.package.outputs.artifact-path }}/
          if-no-files-found: error
          compression-level: 6
