name: Build native Windows app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test release tag guards
        shell: pwsh
        run: ./tests/ReleaseTag.Tests.ps1
      - name: Test and package both deployment variants
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: ./scripts/build.ps1 -Package -Version $env:BUILD_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: SuperCalc-win-x64-packages
          path: artifacts/packages/*
          if-no-files-found: error
          compression-level: 0
